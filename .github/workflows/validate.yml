name: Validate public skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_chatgpt_bundle.py --check
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Reject tracked private files
        shell: bash
        run: |
          if git ls-files | grep -E '(^private/|(^|/)\.env($|\.)|\.private\.)'; then
            echo 'Private path tracked; remove it before publishing.'
            exit 1
          fi
